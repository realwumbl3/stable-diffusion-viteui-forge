# VITE UI
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443;
    server_name sdviteui-74gty58-wh3ty7-80yhvw4.wumbl3.xyz;
    client_max_body_size 50M;

    # ssl_certificate     /etc/letsencrypt/live/sharetube.wumbl3.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sharetube.wumbl3.xyz/privkey.pem;
    # ssl_certificate   /etc/letsencrypt/live/wumbl3.xyz-0001/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wumbl3.xyz-0001/privkey.pem;
    include wumbl3ssl.conf;

    # WebSocket and SSL optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # Additional security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /internal/progress-ws {
        proxy_pass http://localhost:7861;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        add_header X-Accel-Buffering no;

        # SSL/WebSocket specific settings
        proxy_ssl_verify off;
        proxy_ssl_session_reuse off;
    }

    # Everything else (API/HTML/SSE/static) → forwarded to local Nginx on 5077 via tunnel
    location / {
        proxy_pass http://localhost:7861;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;           # CRITICAL: preserve original subdomain
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        add_header X-Accel-Buffering no;
    }

    location /vpstest {
        add_header Content-Type text/plain;
        return 200 "wumbl3vps nginx test";
    }

    location /proxytest {
        add_header Content-Type text/plain;
        return 200 "hello world, proxy test.";
    }
}