<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Progress Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .connected { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .disconnected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .progress { background: #e9ecef; border: 1px solid #ced4da; padding: 10px; margin: 10px 0; }
        .progress-bar { height: 20px; background: #007bff; width: 0%; transition: width 0.3s; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #preview { max-width: 512px; max-height: 512px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>WebSocket Progress Test</h1>

    <div id="status" class="status disconnected">WebSocket: Disconnected</div>

    <div class="progress">
        <div>Progress: <span id="progress-text">0%</span></div>
        <div style="background: #f0f0f0; border: 1px solid #ccc;">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div>ETA: <span id="eta">-</span></div>
        <div>Status: <span id="status-text">-</span></div>
    </div>

    <div>
        <button onclick="connect()">Connect WebSocket</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="generate()">Test Generate</button>
    </div>

    <div>
        <h3>Live Preview:</h3>
        <img id="preview" src="" alt="No preview available" style="display: none;">
    </div>

    <div>
        <h3>Messages:</h3>
        <div id="messages" style="border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: auto; background: #f9f9f9;"></div>
    </div>

    <script>
        let ws = null;
        let currentTaskId = null;

        function log(message) {
            const messages = document.getElementById('messages');
            const timestamp = new Date().toLocaleTimeString();
            messages.innerHTML += `[${timestamp}] ${message}<br>`;
            messages.scrollTop = messages.scrollHeight;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/internal/progress-ws`;

            log(`Connecting to ${wsUrl}...`);

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    log('WebSocket connected');
                    document.getElementById('status').textContent = 'WebSocket: Connected';
                    document.getElementById('status').className = 'status connected';
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        log(`Received: ${JSON.stringify(data, null, 2)}`);
                        handleProgressUpdate(data);
                    } catch (error) {
                        log(`Failed to parse message: ${error}`);
                    }
                };

                ws.onclose = (event) => {
                    log(`WebSocket closed (code: ${event.code})`);
                    document.getElementById('status').textContent = 'WebSocket: Disconnected';
                    document.getElementById('status').className = 'status disconnected';
                    ws = null;
                };

                ws.onerror = (error) => {
                    log(`WebSocket error: ${error}`);
                };

            } catch (error) {
                log(`Failed to create WebSocket: ${error}`);
            }
        }

        function disconnect() {
            if (ws) {
                ws.close(1000, 'User disconnect');
            }
        }

        function handleProgressUpdate(data) {
            if (data.type === 'connected') {
                log('Connection confirmed by server');
                return;
            }

            // Update progress bar
            if (data.progress !== undefined) {
                const progressPercent = Math.round(data.progress * 100);
                document.getElementById('progress-text').textContent = `${progressPercent}%`;
                document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            }

            // Update ETA
            if (data.eta !== undefined) {
                const etaText = data.eta > 0 ? `${Math.round(data.eta)}s` : '-';
                document.getElementById('eta').textContent = etaText;
            }

            // Update status text
            if (data.textinfo) {
                document.getElementById('status-text').textContent = data.textinfo;
            }

            // Update live preview
            if (data.live_preview) {
                const preview = document.getElementById('preview');
                preview.src = data.live_preview;
                preview.style.display = 'block';
                log('Updated live preview');
            }
        }

        async function generate() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('WebSocket not connected. Please connect first.');
                return;
            }

            try {
                // Generate a task ID
                currentTaskId = `task(test-${Date.now()}-${Math.random().toString(36).substr(2, 9)})`;
                log(`Starting generation with task ID: ${currentTaskId}`);

                // Make API request with task ID
                const response = await fetch('/sdapi/v1/txt2img', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: 'a beautiful landscape',
                        negative_prompt: '',
                        steps: 20,
                        width: 512,
                        height: 512,
                        cfg_scale: 7,
                        sampler_name: 'Euler a',
                        batch_size: 1,
                        n_iter: 1,
                        force_task_id: currentTaskId
                    })
                });

                if (!response.ok) {
                    throw new Error(`API request failed: ${response.status}`);
                }

                const result = await response.json();
                log(`Generation started. Got ${result.images ? result.images.length : 0} images.`);

                if (result.images && result.images.length > 0) {
                    // Show final result
                    setTimeout(() => {
                        const finalImg = document.getElementById('preview');
                        finalImg.src = `data:image/png;base64,${result.images[0]}`;
                        finalImg.style.display = 'block';
                        log('Showing final result');
                    }, 1000);
                }

            } catch (error) {
                log(`Generation failed: ${error.message}`);
            }
        }

        // Auto-connect on page load
        window.addEventListener('load', () => {
            log('Page loaded. Click "Connect WebSocket" to test.');
        });
    </script>
</body>
</html>
